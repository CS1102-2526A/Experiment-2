<!DOCTYPE html>
<html>
<head>
    <title>Experiment 1</title>
    <style>
	body {
            background-color: #FFFAF0;
	}
        h1 {
            text-align: center;
            font-size: 20 px;
        }
        h2 {
            font-size: 20 px;
        }
        h3 {
            font-size: 30 px;
        }

        /* Initial state: no animation */
        .left, .right, .bottom {
            position: absolute;
            border-radius: 5 px;
        }

        .left {
            width: 100 px;
            height: 100 px;
            background: red;
            left: 150 px;
            top: 30 px; /* Start position */
        }

        .right {
            width: 100 px;
            height: 100 px;
            background: blue;
            left: 350 px;
            top: 30 px;
        }

        .bottom {
            width: 300 px;
            height: 100 px;
            background-color: purple;
            top: 200 px;
            left: 150 px;
        }

        .box {
            position: relative;
            height: 350 px;
            width: 600 px;
            border: 1 px solid grey;
            background-color: white;
            margin: 45 px;
            border-radius: 10 px;
            overflow: hidden;
        }

        /* Animation keyframes */
        @ keyframes acid {
            from { top: 30 px; }
            to { top: 200px; background-color: transparent; }
        }

        @ keyframes base {
            from { top: 30 px; }
            to { top: 200 px; background-color: transparent; }
        }

        @ keyframes indicator {
            0% { background-color: purple; }
            55% { background-color: purple; }
            100% { background-color: yellow; }
        }

        /* This class will be added on click */
        .start-left {
            animation: acid 5 s forwards;
        }

        .start-right {
            animation: base 5 s forwards;
        }

        .start-indicator {
            animation: indicator 6 s forwards;
        }
    </style>
</head>
<body>
    <h1>CS1102 - Simulated Chemistory Reaction - 2025/2026 Semester A<br/>
        <br/>Experiment 1<br/>
        <br/>Tong Wing Yan 57905703, Tam Wing Nga 58196547, Wong Cheuk Wing 58112774, Wong Ching Yu 58620001
    </h1>
    <br/>
   
    <h2><a href="https://cs1102-2526a.github.io/main/">Return Home Page</a></h2>
    <br/>
   
    <h3>Bridge Camera</h3>
    <p>XXX</p>
    <h3>Click the button to check what color there is.</h3>
    <button onclick="startReaction()">Check it now!</button>
       
    <br/>
    <div class="box">
        <div class="left"></div>
        <div class="right"></div>
        <div class="bottom"></div>
    </div>

    <script>
        function startReaction() {
            // Get elements
            const left = document.querySelector('.left');
            const right = document.querySelector('.right');
            const bottom = document.querySelector('.bottom');

            // Remove any existing animation classes (to allow replay)
            left.classList.remove('start-left');
            right.classList.remove('start-right');
            bottom.classList.remove('start-indicator');

            // Force reflow (so animation restarts)
            void left.offsetWidth;
            void right.offsetWidth;
            void bottom.offsetWidth;

            // Add animation classes
            left.classList.add('start-left');
            right.classList.add('start-right');
            bottom.classList.add('start-indicator');
        }
    </script>
</body>
</html>
